<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marmot V2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: barra lateral de módulos (acero de molde) + área de trabajo clara; tablas densas tipo planilla de planta */
:root{
  --bg:#f1f4f4; --surface:#ffffff; --surface-2:#e8eeef; --line:#d3dddf; --fg:#13242a; --muted:#57696f;
  --accent:#0a6a7b; --accent-ink:#ffffff; --accent-soft:#d8edf0;
  --side:#10252b; --side-fg:#d2e2e5; --side-muted:#86a0a6; --side-hover:#19353c; --side-line:#21404a;
  --good:#28743a; --good-soft:#e0f0e2; --warn:#935600; --warn-soft:#f9ecd4; --bad:#ab271d; --bad-soft:#f7e0dd;
  --rec:#4b7a1d; --rec-soft:#e6f0d8; --shadow:0 10px 40px rgba(10,30,36,.18);
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1618; --surface:#152024; --surface-2:#1b292e; --line:#283a40; --fg:#e1ebed; --muted:#91a5ab;
  --accent:#4dc0d2; --accent-ink:#06282e; --accent-soft:#133a42;
  --side:#0a1113; --side-fg:#cfdfe2; --side-muted:#7a9399; --side-hover:#14252a; --side-line:#1c2f35;
  --good:#6cc07a; --good-soft:#163222; --warn:#e3a646; --warn-soft:#3a2a10; --bad:#ef7a70; --bad-soft:#3d1a17;
  --rec:#9ccc6a; --rec-soft:#22311a; --shadow:0 10px 40px rgba(0,0,0,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e1618; --surface:#152024; --surface-2:#1b292e; --line:#283a40; --fg:#e1ebed; --muted:#91a5ab;
  --accent:#4dc0d2; --accent-ink:#06282e; --accent-soft:#133a42;
  --side:#0a1113; --side-fg:#cfdfe2; --side-muted:#7a9399; --side-hover:#14252a; --side-line:#1c2f35;
  --good:#6cc07a; --good-soft:#163222; --warn:#e3a646; --warn-soft:#3a2a10; --bad:#ef7a70; --bad-soft:#3d1a17;
  --rec:#9ccc6a; --rec-soft:#22311a; --shadow:0 10px 40px rgba(0,0,0,.5); color-scheme:dark }

[hidden]{display:none!important}
html,body{height:100%}
body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-fg);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding:18px 12px 16px 16px}
.brand{display:flex;flex-direction:column;gap:2px;padding:4px 8px 18px;border-bottom:1px solid var(--side-line);margin-bottom:12px}
.brand b{font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:.02em;color:#fff}
:root[data-theme="dark"] .brand b{color:var(--side-fg)}
.brand span{font-size:12px;color:var(--side-muted)}
.brand em{font-style:normal;font-weight:500;font-size:14px;color:var(--accent);margin-left:2px;letter-spacing:.04em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;color:var(--side-fg);padding:8px;border-radius:var(--r);cursor:pointer}
.nav button:hover{background:var(--side-hover)}
.nav button.on{background:var(--side-hover);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.nav .k{font-family:var(--f-mono);font-size:11px;width:28px;height:22px;display:grid;place-items:center;border:1px solid var(--side-line);border-radius:4px;color:var(--side-muted);flex:none}
.nav button.on .k{border-color:var(--accent);color:var(--accent)}
.side .foot{margin-top:auto;padding:14px 8px 0;font-size:12px;color:var(--side-muted);border-top:1px solid var(--side-line)}

.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:5}
.top h1{font-size:24px;margin-right:auto}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.who select{padding:6px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);max-width:240px}
.view{padding:22px 28px 48px;display:flex;flex-direction:column;gap:18px;min-width:0}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.rec{background:var(--rec-soft);color:var(--rec)}
.chip.demo{border:1px dashed var(--warn);background:transparent;color:var(--warn)}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 12px;border-radius:var(--r);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar .sp{margin-right:auto}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:9px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px;min-width:0}
.panel h3{font-size:17px;margin-bottom:10px}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:21px;font-weight:500;overflow-wrap:anywhere}
.kpi .s{font-size:12px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);max-width:75ch}
.ro{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface-2);padding:8px 10px;white-space:nowrap;border-bottom:1px solid var(--line)}
.t td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t .num{text-align:right;white-space:nowrap;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.t tfoot td{font-weight:600;background:var(--surface-2);border-top:1px solid var(--line)}
.t td.empty{text-align:center;color:var(--muted);padding:22px}
.t .sub{display:block;font-size:12px;color:var(--muted)}
.t select{padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--surface)}

.list{display:flex;flex-direction:column}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.flow div{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--surface-2);font-size:13px}
.flow b{display:block;font-family:var(--f-display);font-size:15px;margin-bottom:2px}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:500;color:var(--muted)}
.field input,.field select,.field textarea{padding:7px 9px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);width:100%}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.lines input,.lines select{padding:5px 7px;border:1px solid var(--line);border-radius:4px;background:var(--surface);width:100%}
.lines .q{width:96px}.lines .p{width:120px}
.tots{display:flex;flex-wrap:wrap;gap:6px 22px;justify-content:flex-end;font-size:13px;color:var(--muted)}
.tots b{color:var(--fg);font-family:var(--f-mono);font-weight:500}
.tots .big b{font-size:17px}

#modal{position:fixed;inset:0;background:rgba(8,20,24,.55);display:grid;place-items:center;z-index:50;padding:16px}
.mbox{background:var(--surface);border-radius:10px;box-shadow:var(--shadow);width:min(860px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;border:1px solid var(--line)}
.mhead{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mhead h2{font-size:20px;margin-right:auto}
.mbody{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.mfoot{display:flex;gap:10px;justify-content:flex-end;align-items:center;padding:12px 18px;border-top:1px solid var(--line)}
.merr{color:var(--bad);font-size:13px;margin-right:auto}
.x{border:0;background:transparent;font-size:20px;cursor:pointer;color:var(--muted);padding:0 6px}

#toast{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:8px}
#toast div{background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:6px;font-size:13px;box-shadow:var(--shadow);max-width:360px}
pre.code{margin:0;padding:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;font-family:var(--f-mono);font-size:12px;overflow:auto;max-height:280px}
.tree{font-family:var(--f-mono);font-size:12.5px;line-height:1.7;white-space:pre;overflow-x:auto;color:var(--fg)}
.meter{display:inline-block;width:60px;height:6px;border-radius:3px;background:var(--surface-2);vertical-align:middle;margin-right:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}.meter.over i{background:var(--bad)}.meter.hi i{background:var(--warn)}
.field textarea{resize:vertical;min-height:72px}
.chartwrap{position:relative;overflow-x:auto}
.tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:5px;max-width:260px;box-shadow:var(--shadow);z-index:3}
.fp{cursor:default}
.pick{position:relative;display:flex;flex-direction:column;gap:3px}
.pick input{padding:7px 9px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);width:100%}
.pick-help{font-size:12px;color:var(--muted);font-family:var(--f-mono);min-height:1em}
.pick-list{position:fixed;z-index:70;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:auto;padding:4px}
.pick-list [role=option]{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:7px 9px;border-radius:5px;cursor:pointer;font-size:13px}
.pick-list [role=option] b{font-weight:500;color:var(--accent)}
.pick-list [role=option] .r{color:var(--muted);font-size:12px}
.pick-list [role=option].on{background:var(--accent-soft)}
.pick-empty{margin:0;padding:10px;color:var(--muted);font-size:13px}
#printArea{display:flex;flex-direction:column;gap:22px}
.recpage{background:#fff;color:#111;border:1px solid var(--line);border-radius:6px;padding:18px 22px;max-width:820px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px;font-size:12px}
.rec{display:flex;flex-direction:column;gap:8px}
.rec header{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1.5px solid #111;padding-bottom:6px}
.rec header div{display:flex;flex-direction:column}.rec header b{font-size:14px}.rec header span{color:#444;font-size:11px}
.rec .rt{text-align:right}.rec .rt b{font-family:var(--f-display);font-size:17px;letter-spacing:.02em;text-transform:uppercase}
.rgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 14px}.rgrid span{display:block;color:#555;font-size:10px;text-transform:uppercase;letter-spacing:.05em}.rgrid b{font-weight:600}
.rec table{width:100%;border-collapse:collapse}.rec th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#555;border-bottom:1px solid #999;padding:4px}
.rec td{padding:3px 4px;border-bottom:1px dotted #ccc}.rec .n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.rec tfoot td{border-top:1px solid #999;border-bottom:0;font-weight:600}.rec .neto td{font-size:14px;border-top:1.5px solid #111}
.letras,.decl{margin:0;color:#222}.letras{font-style:italic}
.firmas{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:26px}.firmas div{border-top:1px solid #111;padding-top:4px;text-align:center;color:#333}
.corte{border-top:1.5px dashed #999}
.li{padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--surface);text-align:right}
@media (max-width:600px){.rgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;left:0;top:0;width:100%}.recpage{border:0;page-break-after:always;max-width:none}}
#gate{position:fixed;inset:0;z-index:80;background:var(--side);display:grid;place-items:center;padding:16px}
.gcard{background:var(--surface);color:var(--fg);border-radius:12px;box-shadow:var(--shadow);width:min(460px,100%);padding:28px 28px 24px;display:flex;flex-direction:column;gap:14px}
.gbrand{font-family:var(--f-display);font-size:30px;font-weight:700;letter-spacing:.02em}.gbrand em{font-style:normal;font-size:16px;color:var(--accent);font-weight:500;margin-left:4px}
#gateBody{display:flex;flex-direction:column;gap:12px}#gateBody p{margin:0}
.chip.ok{background:var(--good-soft);color:var(--good)}
.fbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.fbar .field input,.fbar .field select{padding:6px 8px}.fbar .fq{flex:1 1 240px}.fbar .fcount{font-size:12px;color:var(--muted);margin-left:auto;align-self:center}
.tabs{overflow-y:hidden;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
tr.anul td{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}tr.anul td .chip,tr.anul td .btn{text-decoration:none}
.lrow{display:flex;gap:6px;margin-top:4px}.lrow input{flex:1;min-width:0}.lrow select{width:auto}
.pergrid{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}.pergrid>b{width:48px;font-family:var(--f-mono)}
.per{display:flex;flex-direction:column;align-items:center;gap:1px;width:74px;padding:6px 4px;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:var(--surface-2);color:var(--muted)}
.per input{margin:0}.per span{font-weight:600;text-transform:capitalize}.per small{font-size:10.5px}.per.on{background:var(--good-soft);color:var(--good);border-color:var(--good)}.per.cur{outline:2px solid var(--accent);outline-offset:1px}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.flow{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;padding:12px 16px 8px}
  .brand{flex-direction:row;align-items:baseline;gap:10px;padding:0 0 10px;margin-bottom:8px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .nav button{width:auto;white-space:nowrap}
  .side .foot{display:none}
  .top{position:static;padding:12px 16px}
  .view{padding:16px 16px 40px}
  .cols2,.cols3,.grid2,.grid3{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:480px){.kpis,.flow{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion: no-preference){.btn,.nav button{transition:background .15s,border-color .15s}}
</style>
</head>
<body>


<div class="app">
  <aside class="side">
    <div class="brand"><b>Marmot <em>V2.0</em></b><span id="empresaNombre"></span></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot" id="footTxt">Prototipo con datos de ejemplo.<br>Los cambios se guardan solo en este navegador hasta conectar OneDrive.</div>
  </aside>
  <div class="main">
    <header class="top">
      <h1 id="vtitle">Inicio</h1>
      <span class="chip demo" id="demoChip">Modo demostración</span><span class="chip" id="saveChip" hidden></span>
      <span class="chip acc mono" id="cotChip"></span>
      <label class="who" for="who" id="whoBox">Ver como <select id="who"></select></label>
      <span class="who" id="userBox" hidden></span>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>
<div id="modal" hidden></div>
<div id="gate" hidden><div class="gcard"><div class="gbrand">Marmot <em>V2.0</em></div><div id="gateBody"></div></div></div>
<div id="toast" aria-live="polite"></div>

<script>
/* ============ Utilidades ============ */
const TODAY=(()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')})();
const grp=s=>s.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const fInt=n=>{n=Math.round(+n||0);return(n<0?'-':'')+grp(String(Math.abs(n)))};
const fDec=(n,d=2)=>{n=+n||0;const neg=n<0;const[i,f]=Math.abs(n).toFixed(d).split('.');return(neg?'-':'')+grp(i)+(f?','+f:'')};
const fMon=(n,m)=>m==='USD'?'US$ '+fDec(n,2):'₲ '+fInt(n);
const fG=n=>'₲ '+fInt(n);
const fQty=(n,u)=>(u==='kg'||u==='l'?fDec(n,Math.abs(n%1)>1e-9?2:0):fInt(n))+' '+u;
const fDate=s=>{if(!s)return'';const[y,m,d]=s.split('-');return d+'/'+m+'/'+y};
const r2=n=>Math.round(n*100)/100;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const addDays=(f,n)=>{const d=new Date(f+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+(+n||0));return d.toISOString().slice(0,10)};
const dias=(a,b)=>Math.round((new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/864e5);

const MODS=[
 {id:'inicio',n:'Inicio',k:'IN'},{id:'ventas',n:'Ventas',k:'VE'},{id:'cobranzas',n:'Cobranzas',k:'CB'},{id:'compras',n:'Compras',k:'CO'},{id:'pagos',n:'Pagos a proveedores',k:'PP'},

function post(fecha,concepto,origen,ref,lines,cc){chkPeriodo(fecha);

const stA=(p,a)=>r2((p&&p.st&&p.st[a])||0);
function setSt(p,a,d){p.st=p.st||{};p.st[a]=r2((p.st[a]||0)+d);if(Math.abs(p.st[a])<1e-9)delete p.st[a];p.stock=r2(sum(Object.values(p.st),x=>x))}
function faltaStock(p,q,alm){const h=stA(p,alm);if(h<q-1e-9)throw new Error(`Stock insuficiente de ${p.nombre} en el depósito ${almName(alm)}: hay ${fQty(h,p.u)} y se necesitan ${fQty(q,p.u)}. El sistema no permite stock negativo.`)}
function stockIn(pid,q,unitG,fecha,ref,concepto,alm){
  const p=prod(pid);alm=alm||almDef(p);const tot=Math.max(p.stock,0)*p.costo+q*unitG;setSt(p,alm,q);
  p.costo=p.stock>0?tot/p.stock:unitG;
  DB.kardex.push({fecha,pid,alm,ent:q,sal:0,costo:unitG,saldo:p.stock,ref,concepto});
}
function stockOut(pid,q,fecha,ref,concepto,alm){
  const p=prod(pid);alm=alm||almDef(p);faltaStock(p,q,alm);const c=p.costo;setSt(p,alm,-q);
  DB.kardex.push({fecha,pid,alm,ent:0,sal:q,costo:c,saldo:p.stock,ref,concepto});return c*q;
}
function moverStock(pid,q,de,a,fecha,ref,concepto){const p=prod(pid);faltaStock(p,q,de);
  setSt(p,de,-q);DB.kardex.push({fecha,pid,alm:de,ent:0,sal:q,costo:p.costo,saldo:p.stock,ref,concepto,tr:true});
  setSt(p,a,q);DB.kardex.push({fecha,pid,alm:a,ent:q,sal:0,costo:p.costo,saldo:p.stock,ref,concepto,tr:true})}
function lineasStock(items,origen){const out=(items||[]).map(i=>({p:i.p,q:r2(+i.q)})).filter(i=>i.q>0);if(!out.length)throw new Error('Indicá la cantidad de al menos un artículo.');
  const need={};out.forEach(i=>{const p=prod(i.p);if(!p||p.tipo==='SV')throw new Error('Hay un artículo que no es inventariable.');need[i.p]=r2((need[i.p]||0)+i.q)});
  for(const k in need)faltaStock(prod(k),need[k],origen);return out}
function registrarTransfStock(o,uid){chkPeriodo(o.fecha);
  if(!almOk(o.de)||!almOk(o.a))throw new Error('Elegí el depósito de origen y el de destino.');if(o.de===o.a)throw new Error('El depósito de origen y el de destino tienen que ser distintos.');

  items.forEach(i=>{i.cu=prod(i.p).costo;moverStock(i.p,i.q,o.de,o.a,o.fecha,t.numero,`Transferencia ${almName(o.de)} → ${almName(o.a)}`)});
  t.total=Math.round(sum(items,i=>i.q*i.cu));DB.transfs.push(t);

function registrarConsumo(o,uid){chkPeriodo(o.fecha);
  if(!almOk(o.alm))throw new Error('Elegí el depósito del que sale el material.');const cg=cta(o.ctaGasto);if(!cg||cg.t!=='E')throw new Error('Elegí la cuenta de gasto.');
  const motivo=String(o.motivo||'').trim();if(!motivo)throw new Error('Escribí el destino o motivo del consumo (ej.: cambio de rodamientos de la sopladora 1).');

  let tot=0;const cr={};items.forEach(i=>{const p=prod(i.p);const v=stockOut(i.p,i.q,o.fecha,c.numero,'Consumo interno · '+motivo,o.alm);i.cu=v/i.q;tot+=v;cr[invCta(p)]=(cr[invCta(p)]||0)+v});
  c.total=Math.round(tot);const lines=[{c:o.ctaGasto,d:tot}];for(const k in cr)lines.push({c:k,h:cr[k]});

function docTotals(items){
  const t={total:0,iva10:0,iva5:0,g10:0,g5:0,ex:0};
  for(const it of items){const lt=it.q*it.pr;const r=it.cta?+it.iva:prod(it.p).iva;t.total+=lt;
    if(r===10){const i=ivaOf(lt,10);t.iva10+=i;t.g10+=lt-i}else if(r===5){const i=ivaOf(lt,5);t.iva5+=i;t.g5+=lt-i}else t.ex+=lt}
  for(const k in t)t[k]=r2(t[k]);return t;
}

function pedEstado(d){if(d.anulada)return'Anulada';if(d.cerrado)return'Cerrada';return d.items.every(L=>L.fact>=L.q-1e-9)?'Cumplida':d.items.some(L=>L.fact>0)?'Parcial':'Abierta'}

const aProducir=pid=>{const pend=sum(DB.pedidos.filter(pedAbierto).flatMap(d=>d.items).filter(L=>L.p===pid),L=>pedPend(L));return Math.max(0,r2(pend-stA(prod(pid),'PT')-opsPlanPed(pid)))};

function cerrarPedido(id,motivo,uid){const d=DB.pedidos.find(x=>x.id===id);if(!d||!pedAbierto(d))throw new Error('La orden ya no está abierta.');motivo=String(motivo||'').trim();if(!motivo)throw new Error('Escribí el motivo del cierre.');

function createVenta(o,uid){

function numLetras(n){n=Math.round(Math.abs(n));if(!n)return'cero';

  const C=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];

function finalizarOP(id,fecha,uid,x){
  chkPeriodo(fecha);x=x||{};
  const op=DB.ordenes.find(x=>x.id===id);if(!op||op.estado!=='Planificada')throw new Error('La orden ya no está planificada.');const f=DB.formulas.find(x=>x.id===op.formula);
  const opr=(x.operarios||[]).map(o=>({emp:o.emp,horas:r2(+o.horas||0),unid:r2(+o.unid||0)})).filter(o=>o.emp&&(o.horas>0||o.unid>0));

  const vistos=new Set();opr.forEach(o=>{const e=emp(o.emp);if(!e)throw new Error('Hay un operario que no existe.');if(vistos.has(o.emp))throw new Error(`${e.nombre} está cargado dos veces.`);vistos.add(o.emp);if(o.horas<0||o.horas>24*31)throw new Error(`Revisá las horas de ${e.nombre}.`);o.ch=costoHoraEmp(e);o.costo=Math.round(o.horas*o.ch)});

  const mo=sum(opr,o=>o.costo);const mq=DB.maquinas.find(m=>m.n===(op.maquina||f.maquina));const ccP=(mq&&mq.cc)||f.cc;
  const req=reqOP(f,op.cantidad);
  for(const r of req){const p=prod(r.p),h=stA(p,'PRD'),m=stA(p,'MP');if(h<r.need-1e-9)throw new Error(`Falta ${p.nombre} en el depósito Producción: se necesitan ${fQty(r.need,p.u)} y hay ${fQty(h,p.u)}.`+(m>0?` En Materia prima hay ${fQty(m,p.u)}: transferí lo que falta a Producción antes de finalizar.`:''))}
  let cost=0;op.consumos=[];for(const r of req){const c=stockOut(r.p,r.need,fecha,op.id,'Consumo en producción','PRD');cost+=c;op.consumos.push({p:r.p,q:r.need,cu:c/r.need,alm:'PRD'})}

  const scrapKg=r2(sum(f.comp,c=>c.q)*op.cantidad*f.merma);
  stockIn(f.pt,op.cantidad,(base+mo)/op.cantidad,fecha,op.id,'Ingreso de producción','PT');
  const lines=[{c:'1.1.31',d:base+mo}];let rec=0;if(mo>0)lines.push({c:'5.2.09',h:mo,cc:ccP});
  if(f.recupera&&scrapKg>0){rec=Math.min(mermaC,scrapKg*prod('RC01').costo);op.scrapCu=rec/scrapKg;op.scrapAlm='PRD';stockIn('RC01',scrapKg,rec/scrapKg,fecha,op.id,'Scrap recuperado (molido)','PRD');lines.push({c:'1.1.30',d:rec})}
  if(mermaC-rec>0.5)lines.push({c:'5.1.02',d:mermaC-rec});
  lines.push({c:'1.1.30',h:cost});
  Object.assign(op,{estado:'Finalizada',fechaFin:fecha,costo:Math.round(cost),costoMP:Math.round(base),mo:Math.round(mo),costoUnit:(base+mo)/op.cantidad,scrap:f.recupera?scrapKg:0,merma:Math.round(mermaC-rec),operarios:opr,horasMaq,maquina:op.maquina||f.maquina});
  op.asiento=post(fecha,`Orden ${op.id} · ${fInt(op.cantidad)} × ${prod(f.pt).nombre} · ${op.maquina}`,'Producción',op.id,lines,ccP).nro;
  log(`Finalizó la orden ${op.id}`,uid);
}

  if(!db.plan.some(c=>c.c==='1.1.32')){const i=db.plan.findIndex(c=>c.c==='1.1.31');db.plan.splice(i+1,0,{c:'1.1.32',n:'Repuestos y materiales de mantenimiento',t:'A'})}

    if(!db.maquinas){const nm=[...new Set((db.formulas||[]).map(f=>f.maquina).filter(Boolean))];db.maquinas=nm.map((n,i)=>{const f=db.formulas.find(x=>x.maquina===n);return{id:'M'+(i+1),n,cc:f?f.cc:'ADM',activo:true}})}

async function odUpload(name,body,cond){
  const enc=new TextEncoder().encode(body);const hdr=cond==='new'?{'If-None-Match':'*'}:cond?{'If-Match':cond}:{};
  if(enc.length<3.8e6){const r=await gfetch(odPath(name)+'/content',{method:'PUT',headers:{'Content-Type':'application/json',...hdr},body:enc});
    if(r.status===412||r.status===409){const e=new Error('conflicto');e.conflict=true;throw e}if(!r.ok)throw new Error('Error al guardar ('+r.status+').');return r.json()}
  const s=await gfetch(odPath(name)+'/createUploadSession',{method:'POST',headers:{'Content-Type':'application/json',...hdr},body:JSON.stringify({item:{'@microsoft.graph.conflictBehavior':cond==='new'?'fail':'replace'}})});
  if(s.status===412||s.status===409){const e=new Error('conflicto');e.conflict=true;throw e}if(!s.ok)throw new Error('Error al iniciar la carga ('+s.status+').');
  const{uploadUrl}=await s.json();const CH=327680*10;let res;
  for(let i=0;i<enc.length;i+=CH){const part=enc.slice(i,i+CH);res=await fetch(uploadUrl,{method:'PUT',headers:{'Content-Range':`bytes ${i}-${i+part.length-1}/${enc.length}`},body:part});if(!res.ok&&res.status!==202)throw new Error('Error al subir la base de datos ('+res.status+').')}
  return res.json();
}

    <h3 style="margin-top:16px">Cómo se conectan los módulos</h3>

};

V.ventas=()=>{

   ${ed?`<button class="btn" data-act="nuevoCliente">Nuevo cliente</button><button class="btn" data-act="nuevoPedido">Nueva orden de venta</button><button class="btn primary" data-act="nuevaVenta">Nueva factura</button>`:''}</div>`;

    h+=T([['Orden'],['Fecha'],['Cliente'],['Vendedor'],['Entrega'],['Total',1],['Pendiente de entregar',1],['Facturas'],['Estado'],['']],[...L].reverse().map(d=>{const c=cli(d.cliente),pv=pedValorPend(d),atr=pedAbierto(d)&&d.entrega<TODAY;

    h+=`<p class="note">La orden de venta registra lo comprometido con el cliente. Se factura desde la orden, en una o varias entregas, y cada factura descuenta lo pendiente. Lo que falta fabricar se ve en Pendientes de entrega.</p>`;
  }else if(t==='pend'){
    const rows=[];DB.pedidos.filter(pedAbierto).sort((a,b)=>a.entrega<b.entrega?-1:1).forEach(d=>d.items.forEach((L,i)=>{const q=pedPend(L);if(q>1e-9)rows.push({d,L,i,q})}));
    const prods=[...new Set(rows.map(r=>r.L.p))];

    h+=`<h3 style="font-size:17px">Producción necesaria por producto</h3>`+T([['Producto'],['Pendiente de entregar',1],['Stock en Productos terminados',1],['En órdenes de producción',1],['A producir',1],['']],prods.map(pid=>{const p=prod(pid),pend=r2(sum(rows.filter(r=>r.L.p===pid),r=>r.q)),st=stA(p,'PT'),op=opsPlanPed(pid),fal=Math.max(0,r2(pend-st-op)),f=DB.formulas.find(x=>x.pt===pid);
      return`<tr>${td('<span class="mono">'+pid+'</span> '+esc(p.nombre))}${td(fQty(pend,p.u),1)}${td(fQty(st,p.u),1)}${td(op?fQty(op,p.u):'—',1)}${td(fal?`<b style="color:var(--bad)">${fQty(fal,p.u)}</b>`:'<span class="chip good">Cubierto</span>',1)}${td(fal&&f&&can('produccion',2)?`<button class="btn sm" data-act="nuevaOP" data-f="${f.id}" data-q="${Math.ceil(fal)}">Producir</button>`:'')}</tr>`}),'No hay entregas pendientes.');
    h+=`<h3 style="font-size:17px">Detalle por orden de venta</h3>`+T([['Entrega'],['Orden'],['Cliente'],['Vendedor'],['Producto'],['Pedido',1],['Entregado',1],['Pendiente',1],['Producción vinculada'],['']],rows.map(({d,L,i,q})=>{const p=prod(L.p),opl=DB.ordenes.filter(o=>o.pedido===d.id&&o.ol===i&&o.estado!=='Anulada'),f=DB.formulas.find(x=>x.pt===L.p);
      return`<tr>${td(fDate(d.entrega)+(d.entrega<TODAY?'<span class="sub" style="color:var(--bad)">Atrasada</span>':''))}${td('<span class="mono">'+d.numero+'</span>')}${td(esc(cli(d.cliente).nombre))}${td(esc(userName(d.vendedor)))}${td(esc(p.nombre))}${td(fQty(L.q,p.u),1)}${td(fQty(L.fact,p.u),1)}${td('<b>'+fQty(q,p.u)+'</b>',1)}${td(opl.map(o=>`<span class="mono">${o.id}</span> ${fInt(o.cantidad)} u · ${o.estado.toLowerCase()}`).join('<br>')||'—')}${td((ed?`<button class="btn sm" data-act="nuevaVenta" data-ped="${d.id}">Facturar</button> `:'')+(f&&can('produccion',2)?`<button class="btn sm" data-act="nuevaOP" data-f="${f.id}" data-q="${sugOP(L.p,q)}" data-ped="${d.id}" data-ol="${i}">Producir</button>`:''))}</tr>`}),'No hay entregas pendientes.');
    h+=`<p class="note">"A producir" descuenta del total pendiente el stock de Productos terminados y lo que ya está en órdenes de producción planificadas. El stock es común a todas las órdenes: se entrega en el orden en que se factura.</p>`;
  }else if(t==='fact'){
    const L=filtrar('ven.fact',DB.ventas,v=>{const c=cli(v.cliente);return`${v.numero} ${c.id} ${c.nombre} ${c.ruc} ${userName(v.vendedor)} ${montoTxt(v.total,v.moneda)}`},v=>v.fecha,estDoc);
    h+=filtroBar('ven.fact',DB.ventas.length,L.length,['Pendiente','Pagada','Anulada']);
    h+=T([['Fecha'],['Número'],['Código'],['Cliente'],['Vendedor'],['Condición'],['Total',1],['Saldo',1],['Estado'],['']],[...L].sort((a,b)=>a.fecha<b.fecha?1:a.fecha>b.fecha?-1:a.numero<b.numero?1:-1).map(v=>{const c=cli(v.cliente);return`<tr class="${v.anulada?'anul':''}">${td(fDate(v.fecha))}${td('<span class="mono">'+v.numero+'</span>'+(v.inicial?'<span class="sub">Saldo inicial</span>':''))}${td('<span class="mono">'+c.id+'</span>')}${td(esc(c.nombre)+(v.pedido?`<span class="sub">${(DB.pedidos.find(x=>x.id===v.pedido)||{}).numero||''}</span>`:''))}${td(esc(userName(v.vendedor)))}${td(v.condicion==='contado'?'Contado':'Crédito '+(v.plazo?v.plazo+' días':'')+(v.saldo>0.004?`<span class="sub">Vence ${fDate(v.vence)}</span>`:''))}${td(fMon(v.total,v.moneda)+(v.moneda==='USD'?`<span class="sub">${fG(v.total*v.cotiz)}</span>`:''),1)}${td(fMon(v.saldo,v.moneda),1)}${td(chipDoc('venta',v)||chipEstado(v.saldo))}${td(`<button class="btn sm" data-act="verVenta" data-id="${v.id}">Ver</button>`)}</tr>`}),'No hay facturas que coincidan con el filtro.');
  }else{
    const L=filtrar('ven.cli',DB.clientes,c=>`${c.id} ${c.nombre} ${c.ruc} ${c.tel||''}`,null,c=>c.plazo>0&&c.limite>0?'Crédito habilitado':'Solo contado');
    h+=filtroBar('ven.cli',DB.clientes.length,L.length,{l:'Crédito',o:['Crédito habilitado','Solo contado']});
    h+=T([['Código'],['Razón social'],['RUC'],['Moneda'],['Crédito'],['Plazo',1],['Límite de crédito',1],['Disponible',1],['']],L.map(c=>{const k=cartera(c);return`<tr>${td('<span class="mono">'+c.id+'</span>')}${td(esc(c.nombre)+(c.tel?`<span class="sub">${esc(c.tel)}</span>`:''))}${td(c.ruc)}${td(c.m==='USD'?'Dólares':'Guaraníes')}${td(c.plazo>0&&c.limite>0?'<span class="chip good">Habilitado</span>':'<span class="chip">Solo contado</span>')}${td(c.plazo?c.plazo+' días':'—',1)}${td(c.limite?fMon(c.limite,c.m):'—',1)}${td(c.limite?fMon(c.limite-k.usado,c.m):'—',1)}${td((can('ventas',2)?`<button class="btn sm" data-act="editarCliente" data-id="${c.id}">Editar</button> `:'')+(can('cobranzas')?`<button class="btn sm" data-act="verCliente" data-id="${c.id}">Estado de cuenta</button>`:''))}</tr>`}),'No hay clientes que coincidan con el filtro.');
    h+=`<p class="note">Solo los perfiles con permiso para aprobar crédito pueden habilitar el crédito de un cliente o cambiar su límite. Los clientes nuevos cargados por otros usuarios quedan como de contado.</p>`;
  }

function reciboTable(key){const L=filtrar(key,DB.recibos,r=>{const c=cli(r.cliente);return`${r.numero} ${c.id} ${c.nombre} ${c.ruc} ${r.medio} ${r.ref} ${(r.medios||[]).map(m=>(m.nro||'')+' '+(m.banco||'')).join(' ')} ${r.apps.map(a=>a.numero).join(' ')} ${montoTxt(r.total,r.moneda)}`},r=>r.fecha,r=>r.anulada?'Anulado':'Vigente');

   <div class="bar"><span class="sp">${tabs('cobranzas',[['cart','Seguimiento de clientes'],['ant','Antigüedad de saldos'],['rec','Recibos'],['ges','Gestiones y promesas'],['ret','Retenciones de IVA'],['aut','Autorizaciones'+(DB.solicitudes.some(x=>x.estado==='Pendiente')?' ('+DB.solicitudes.filter(x=>x.estado==='Pendiente').length+')':'')]])}</span>${roChip('cobranzas')}${ed?'<button class="btn" data-act="nuevaGestion">Registrar gestión</button><button class="btn primary" data-act="nuevoRecibo">Nuevo recibo</button>':''}</div>`;
  if(t==='cart'){

    h+=T([['Cliente'],['Saldo (₲)',1],['Vencido (₲)',1],['Atraso máx.',1],['Uso del límite',1],['Última gestión'],['Próximo paso'],['Estado'],['']],rows,'No hay clientes con saldo pendiente.');
    h+=`<p class="note">Saldos en dólares valuados a ₲ ${fInt(cz)}. El uso del límite compara el saldo pendiente con el límite de crédito del cliente.</p>`;
  }else if(t==='ant'){
    const B=['Por vencer','1 a 30 días','31 a 60 días','61 a 90 días','Más de 90 días'];const tt=[0,0,0,0,0];
    const rows=ks.filter(x=>x.k.total>0).map(({c,k})=>{k.b.forEach((v,i)=>tt[i]+=v);return`<tr>${td(esc(c.nombre))}${k.b.map((v,i)=>td(v?`<span style="${i>=2?'color:var(--bad)':''}">${fInt(v)}</span>`:'—',1)).join('')}${td(fInt(k.total),1)}</tr>`});
    h+=T([['Cliente'],...B.map(b=>[b,1]),['Total ₲',1]],rows,'No hay saldos pendientes.',`<tr><td>Total</td>${tt.map(v=>`<td class="num">${fInt(v)}</td>`).join('')}<td class="num">${fInt(sum(tt,x=>x))}</td></tr>`);
    h+=`<p class="note">Los días se cuentan desde el vencimiento de cada factura. Importes en guaraníes; los saldos en dólares se valúan a ₲ ${fInt(cz)}.</p>`;
  }else if(t==='rec'){h+=reciboTable('cob.rec')}
  else if(t==='ret'){const R_=[];DB.recibos.forEach(r=>(r.medios||[]).filter(m=>m.tipo==='retencion').forEach(m=>R_.push({r,m})));
    const L=filtrar('cob.ret',R_,x=>`${x.m.nro} ${x.r.numero} ${cli(x.r.cliente).nombre} ${cli(x.r.cliente).ruc} ${montoTxt(x.m.monto,x.r.moneda)}`,x=>x.r.fecha,x=>x.r.anulada?'Anulada':'Vigente');
    h+=filtroBar('cob.ret',R_.length,L.length,['Vigente','Anulada'])+T([['Fecha'],['Comprobante de retención'],['Cliente (agente de retención)'],['RUC'],['Recibo'],['Facturas'],['Importe retenido',1]],[...L].reverse().map(({r,m})=>`<tr class="${r.anulada?'anul':''}">${td(fDate(r.fecha))}${td('<span class="mono">'+esc(m.nro)+'</span>')}${td(esc(cli(r.cliente).nombre))}${td(cli(r.cliente).ruc)}${td('<span class="mono">'+r.numero+'</span>')}${td(r.apps.map(a=>'<span class="mono">'+a.numero+'</span>').join('<br>'))}${td(fMon(m.monto,r.moneda),1)}</tr>`),'No hay retenciones registradas.',L.length?`<tr><td colspan="6">Total retenido (vigentes)</td><td class="num">${fG(sum(L.filter(x=>!x.r.anulada),x=>x.m.monto*x.r.cotiz))}</td></tr>`:'');
    h+=`<p class="note">Las retenciones de IVA que te hacen los clientes se registran en la cuenta Retenciones de IVA recibidas y se descuentan del impuesto a pagar en la liquidación mensual de IVA. Guardá los comprobantes de retención.</p>`}
  else if(t==='aut'){const ap=can('autcred');
    h+=T([['Fecha'],['Cliente'],['Productos'],['Total',1],['Motivo'],['Solicitó'],['Estado'],['']],[...DB.solicitudes].sort((a,b)=>a.estado==='Pendiente'?-1:b.estado==='Pendiente'?1:a.fecha<b.fecha?1:-1).map(x=>`<tr>${td(fDate(x.fecha))}${td(esc(cli(x.cliente).nombre))}${td(x.venta.items.map(i=>fQty(i.q,prod(i.p).u)+' '+esc(prod(i.p).nombre)).join('<br>'))}${td(fMon(x.total,x.moneda),1)}${td('<span class="note">'+esc(x.motivo||'')+'</span>')}${td(esc(userName(x.usuario)))}${td(x.estado==='Pendiente'?'<span class="chip warn">Pendiente</span>':x.estado==='Aprobada'?`<span class="chip good">Aprobada</span><span class="sub">Factura ${x.factura} · ${esc(userName(x.resolvio))}</span>`:`<span class="chip bad">Rechazada</span><span class="sub">${esc(userName(x.resolvio))}${x.obs?' · '+esc(x.obs):''}</span>`)}${td(x.estado==='Pendiente'&&ap?`<button class="btn sm" data-act="verCliente" data-id="${x.cliente}">Ver cliente</button> <button class="btn sm" data-act="rechazarSol" data-id="${x.id}">Rechazar</button> <button class="btn sm primary" data-act="aprobarSol" data-id="${x.id}">Aprobar</button>`:'')}</tr>`),'No hay solicitudes de autorización.');
    h+=`<p class="note">${ap?'Al aprobar, la factura se emite con la fecha de hoy y queda registrado quién la autorizó.':'Solo los roles con permiso para aprobar crédito pueden aprobar o rechazar estas solicitudes.'}</p>`}
  else{
    h+=T([['Fecha'],['Cliente'],['Gestión'],['Comentario'],['Promesa de pago'],['Responsable']],[...DB.gestiones].sort((a,b)=>a.fecha<b.fecha?1:-1).map(g=>`<tr>${td(fDate(g.fecha))}${td(esc(cli(g.cliente).nombre))}${td(esc(g.tipo))}${td(esc(g.nota))}${td(g.promesa?`${fMon(g.promesa.monto,g.promesa.moneda)} · ${fDate(g.promesa.fecha)}<br>${promChip(g)}`:'—')}${td(esc(userName(g.usuario)))}</tr>`),'Todavía no hay gestiones registradas.');
    h+=`<p class="note">Una promesa se marca como cumplida cuando el cliente paga el monto prometido después de la gestión, y como incumplida si pasa la fecha sin ese pago.</p>`;
  }
  return h;
};

  }else if(t==='art'){

    h+=filtroBar('com.art',DB.productos.length,L.length,{l:'Familia',o:DB.familias.map(f=>f.n)});
    h+=T([['Código'],['Descripción'],['Familia'],['Tipo'],['Unidad'],['IVA',1],['Cuenta contable'],['Último precio de compra',1],['Stock',1],['']],L.map(p=>{let lp=null;DB.compras.filter(c=>!c.anulada).forEach(c=>c.items.forEach(i=>{if(i.p===p.id&&(!lp||c.fecha>=lp.f))lp={f:c.fecha,pr:i.pr,m:c.moneda,pv:c.proveedor}}));
      return`<tr class="${p.activo===false?'anul':''}">${td('<span class="mono">'+p.id+'</span>')}${td(esc(p.nombre))}${td(esc(famName(p.familia)))}${td(tipoChip(p.tipo))}${td(p.u==='kg'?'Kilogramo':'Unidad')}${td(p.iva?p.iva+' %':'Exento',1)}${td('<span class="mono">'+invCta(p)+'</span> '+esc(cta(invCta(p)).n))}${td(lp?fMon(lp.pr,lp.m)+`<span class="sub">${fDate(lp.f)} · ${esc(prv(lp.pv).nombre)}</span>`:'—',1)}${td(p.tipo==='SV'?'—':fQty(p.stock,p.u),1)}${td(ed?`<button class="btn sm" data-act="editarArticulo" data-id="${p.id}">Editar</button>`:'')}</tr>`}));
    h+=`<p class="note">Los artículos inventariables suman stock al comprarse y se registran en su cuenta de inventario. Los servicios (fletes, mantenimiento, reparaciones) van directo a su cuenta de gasto y no mueven stock. Las familias se configuran en Configuración.</p>`;
  }else if(t==='fact'){
    const L=filtrar('com.fact',DB.compras,c=>{const pv=prv(c.proveedor);return`${c.numero} ${pv.id} ${pv.nombre} ${pv.ruc} ${c.timbrado} ${c.oc?DB.ocs.find(x=>x.id===c.oc).numero:''} ${montoTxt(c.total,c.moneda)}`},c=>c.fecha,estDoc);
    h+=filtroBar('com.fact',DB.compras.length,L.length,['Pendiente','Pagada','Anulada']);
    h+=T([['Fecha'],['Número'],['Código'],['Proveedor'],['Condición'],['Total',1],['Saldo',1],['Estado'],['']],[...L].sort((a,b)=>a.fecha<b.fecha?1:-1).map(c=>`<tr class="${c.anulada?'anul':''}">${td(fDate(c.fecha))}${td('<span class="mono">'+c.numero+'</span>'+(c.oc?`<span class="sub">Orden ${DB.ocs.find(x=>x.id===c.oc).numero}</span>`:'')+(c.cdc?'<span class="sub">Importada de factura electrónica</span>':''))}${td('<span class="mono">'+c.proveedor+'</span>')}${td(esc(prv(c.proveedor).nombre))}${td(c.condicion==='contado'?'Contado':'Crédito '+(c.plazo?c.plazo+' días':'')+(c.saldo>0.004?`<span class="sub">Vence ${fDate(c.vence)}</span>`:''))}${td(fMon(c.total,c.moneda)+(c.moneda==='USD'?`<span class="sub">${fG(c.total*c.cotiz)}</span>`:''),1)}${td(fMon(c.saldo,c.moneda),1)}${td(chipDoc('compra',c)||chipEstado(c.saldo))}${td(`<button class="btn sm" data-act="verCompra" data-id="${c.id}">Ver</button>`)}</tr>`),'No hay facturas que coincidan con el filtro.');
  }else if(t==='cxp'){

  }else{
    const LP=filtrar('com.prv',DB.proveedores,c=>`${c.id} ${c.nombre} ${c.ruc} ${c.tel||''}`);
    h+=filtroBar('com.prv',DB.proveedores.length,LP.length);
    h+=T([['Código'],['Razón social'],['RUC'],['Moneda'],['Plazo de pago',1],['Órdenes abiertas',1],['Saldo a pagar',1],['']],LP.map(c=>`<tr>${td('<span class="mono">'+c.id+'</span>')}${td(esc(c.nombre)+(c.tel?`<span class="sub">${esc(c.tel)}</span>`:''))}${td(c.ruc)}${td(c.m==='USD'?'Dólares':'Guaraníes')}${td(c.plazo?c.plazo+' días':'Contado',1)}${td(DB.ocs.filter(o=>o.proveedor===c.id&&ocAbierta(o)).length||'—',1)}${td(fMon(sum(DB.compras.filter(x=>x.proveedor===c.id&&x.moneda===c.m),x=>x.saldo),c.m),1)}${td(ed?`<button class="btn sm" data-act="editarProveedor" data-id="${c.id}">Editar</button>`:'')}</tr>`));
  }
  return h;

function pagoTable(key){const L=filtrar(key,DB.pagos,r=>{const pv=prv(r.proveedor);return`${r.numero} ${pv.id} ${pv.nombre} ${pv.ruc} ${r.medio} ${r.ref} ${r.apps.map(a=>a.numero).join(' ')} ${montoTxt(r.total,r.moneda)}`},r=>r.fecha,r=>r.anulada?'Anulado':'Vigente');const ed=can('pagos',2);

const opChip=e=>({'Por autorizar':'<span class="chip warn">Por autorizar</span>',Autorizada:'<span class="chip acc">Autorizada · a pagar</span>',Pagada:'<span class="chip good">Pagada</span>',Rechazada:'<span class="chip bad">Rechazada</span>',Anulada:'<span class="chip bad">Anulada</span>','Pago anulado':'<span class="chip bad">Pago anulado</span>'})[e];

   <p class="letras">Son ${letrasMon(op.total,op.moneda)}.</p>${op.medio==='Cheque'?`<p class="decl">Cheque N° ${esc(op.nroCheque)} de ${esc(t.banco||t.n)}, fecha ${fDate(op.fechaCheque)}, por ${fMon(op.total,op.moneda)}.</p>`:op.ref?`<p class="decl">Referencia: ${esc(op.ref)}</p>`:''}${op.obs?`<p class="decl">Observación: ${esc(op.obs)}</p>`:''}

function flowChart(per){
  const W=760,H=230,pl=86,pr=16,pt=16,pb=30,vals=per.map(p=>p.sf);let mn=Math.min(0,...vals),mx=Math.max(...vals);const pad=(mx-mn)*0.08||1;mn-=mn<0?pad:0;mx+=pad;
  const x=i=>pl+(W-pl-pr)*(per.length===1?0.5:i/(per.length-1)),y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  const step=(()=>{const r=(mx-mn)/4,m=Math.pow(10,Math.floor(Math.log10(r)));return[1,2,2.5,5,10].map(k=>k*m).find(k=>k>=r)})();
  let ticks='';for(let v=Math.ceil(mn/step)*step;v<=mx;v+=step)ticks+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1" ${v===0?'':'stroke-dasharray="2 4"'}/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-mono)">${fInt(v/1e6)} M</text>`;
  const lastReal=per.reduce((a,p,i)=>p.tipo!=='proy'?i:a,0);
  const pts=per.map((p,i)=>`${x(i)},${y(p.sf)}`);
  const area=`M${x(0)},${y(Math.max(mn,0))} L${pts.join(' L')} L${x(per.length-1)},${y(Math.max(mn,0))} Z`;
  const solid=pts.slice(0,lastReal+1).join(' '),dash=pts.slice(lastReal).join(' ');
  const labs=per.map((p,i)=>`<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="11" fill="${p.tipo==='proy'?'var(--muted)':'var(--fg)'}">${p.lab}</text>`).join('');
  const dots=per.map((p,i)=>`<g class="fp" data-tip="${esc(p.lab+' · saldo final '+fG(p.sf)+' · ingresos '+fG(p.ing)+' · egresos '+fG(p.egr)+(p.tipo==='real'?' · real':p.tipo==='mixto'?' · real + proyectado':' · proyectado'))}"><rect x="${x(i)-18}" y="${pt}" width="36" height="${H-pt-pb}" fill="transparent"/><circle cx="${x(i)}" cy="${y(p.sf)}" r="${p.sf<0?5:4}" fill="${p.sf<0?'var(--bad)':'var(--accent)'}" stroke="var(--surface)" stroke-width="2"/></g>`).join('');
  return`<div class="chartwrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Saldo de caja al final de cada período" style="width:100%;min-width:560px;height:auto;display:block">${ticks}
   <rect x="${x(lastReal)}" y="${pt}" width="${W-pr-x(lastReal)}" height="${H-pt-pb}" fill="var(--surface-2)" opacity=".6"/>
   <text x="${x(lastReal)+6}" y="${pt+12}" font-size="11" fill="var(--muted)">Proyectado</text>
   <path d="${area}" fill="var(--accent)" opacity=".08"/><polyline points="${solid}" fill="none" stroke="var(--accent)" stroke-width="2"/><polyline points="${dash}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 5"/>${dots}${labs}</svg><div class="tip" hidden></div></div>`;
}

    h+=`<h3 style="font-size:17px">Transferencias entre depósitos</h3>`+filtroBar('inv.trf',DB.transfs.length,LT.length,['Vigente','Anulada'])+T([['Número'],['Fecha'],['Desde'],['Hacia'],['Artículos'],['Valor al costo',1],['Registró'],['']],[...LT].reverse().map(x=>`<tr class="${x.anulada?'anul':''}">${td('<span class="mono">'+x.numero+'</span>'+(x.op?`<span class="sub">Orden ${x.op}</span>`:''))}${td(fDate(x.fecha))}${td(esc(almName(x.de)))}${td(esc(almName(x.a)))}${td(x.items.map(i=>`${fQty(i.q,prod(i.p).u)} ${esc(prod(i.p).nombre)}`).join('<br>')+(x.obs?`<span class="sub">${esc(x.obs)}</span>`:''))}${td(fG(x.total||0),1)}${td(esc(userName(x.usuario)))}${td(chipDoc('transf',x)||(ed?`<button class="btn sm" data-act="invalidar" data-t="transf" data-id="${x.id}">Invalidar</button>`:''))}</tr>`),'No hay transferencias que coincidan con el filtro.');
    const LC2=filtrar('inv.ci',DB.consumos,x=>`${x.numero} ${almName(x.alm)} ${x.motivo} ${x.cc} ${ccName(x.cc)} ${x.items.map(i=>i.p+' '+prod(i.p).nombre).join(' ')}`,x=>x.fecha,x=>x.anulada?'Anulada':'Vigente');
    h+=`<h3 style="font-size:17px">Consumos internos</h3>`+filtroBar('inv.ci',DB.consumos.length,LC2.length,['Vigente','Anulada'])+T([['Número'],['Fecha'],['Depósito'],['Destino o motivo'],['Artículos'],['Centro de costo'],['Cuenta de gasto'],['Importe',1],['']],[...LC2].reverse().map(x=>`<tr class="${x.anulada?'anul':''}">${td('<span class="mono">'+x.numero+'</span>')}${td(fDate(x.fecha))}${td(esc(almName(x.alm)))}${td(esc(x.motivo)+`<span class="sub">${esc(userName(x.usuario))}</span>`)}${td(x.items.map(i=>`${fQty(i.q,prod(i.p).u)} ${esc(prod(i.p).nombre)}`).join('<br>'))}${td(esc(ccName(x.cc)))}${td(esc((cta(x.ctaGasto)||{}).n||x.ctaGasto))}${td(fG(x.total),1)}${td(chipDoc('consumo',x)||(ed?`<button class="btn sm" data-act="invalidar" data-t="consumo" data-id="${x.id}">Invalidar</button>`:''))}</tr>`),'No hay consumos internos que coincidan con el filtro.');
    h+=`<p class="note">Una transferencia mueve stock entre depósitos sin generar asiento, porque el artículo sigue en la misma cuenta de inventario. Un consumo interno (repuestos, aceite, insumos de limpieza) da de baja el material a su costo promedio y lo imputa a la cuenta de gasto y al centro de costo elegidos.</p>`;
  }else{
    const p=prod(S.kardex)||DB.productos[0],ka=almOk(S.kxAlm)?S.kxAlm:'';
    h+=`<div class="bar">${fSel('kx','Producto',DB.productos.filter(x=>x.tipo!=='SV').map(x=>[x.id,x.id+' · '+x.nombre]),p.id,'data-chg="kardex"')}${fSel('kxa','Depósito',[['','Todos los depósitos'],...almOpts()],ka,'data-chg="kxAlm"')}</div>`;
    const run={};const K=DB.kardex.filter(k=>k.pid===p.id).map(k=>{run[k.alm]=r2((run[k.alm]||0)+k.ent-k.sal);return{...k,sa:run[k.alm]}}).filter(k=>!ka||k.alm===ka);
    h+=`<p class="note">Saldo actual: ${ka?esc(almName(ka))+' '+fQty(stA(p,ka),p.u):AL.filter(a=>stA(p,a.id)).map(a=>esc(a.n)+' '+fQty(stA(p,a.id),p.u)).join(' · ')||'sin stock'} · costo promedio ${fG(p.costo)} / ${p.u}</p>`;
    h+=T([['Fecha'],['Comprobante'],['Concepto'],['Depósito'],['Entrada',1],['Salida',1],['Costo unit.',1],[ka?'Saldo del depósito':'Saldo total',1]],K.map(k=>`<tr>${td(fDate(k.fecha))}${td('<span class="mono">'+esc(k.ref)+'</span>')}${td(esc(k.concepto))}${td(esc(almName(k.alm)))}${td(k.ent?fQty(k.ent,p.u):'',1)}${td(k.sal?fQty(k.sal,p.u):'',1)}${td(fG(k.costo),1)}${td(fQty(ka?k.sa:k.saldo,p.u),1)}</tr>`),'No hay movimientos.');
  }
  return h;
};

V.produccion=()=>{
  const t=curTab('produccion','op'),ed=can('produccion',2);let h=`<div class="bar"><span class="sp">${tabs('produccion',[['op','Órdenes de producción'],['form','Fórmulas'],['maq','Máquinas']])}</span>${roChip('produccion')}${ed?'<button class="btn primary" data-act="nuevaOP">Nueva orden</button>':''}</div>`;
  if(t==='op'){
    const LO=filtrar('pro.op',DB.ordenes,o=>{const f=DB.formulas.find(x=>x.id===o.formula);const pd=DB.pedidos.find(x=>x.id===o.pedido);return`${o.id} ${f.pt} ${prod(f.pt).nombre} ${o.maquina||f.maquina} ${pd?pd.numero+' '+cli(pd.cliente).nombre:''} ${(o.operarios||[]).map(x=>emp(x.emp).nombre).join(' ')}`},o=>o.fechaFin||o.fecha,o=>o.estado);
    h+=filtroBar('pro.op',DB.ordenes.length,LO.length,['Planificada','Finalizada','Anulada']);
    h+=T([['Orden'],['Fecha'],['Producto'],['Máquina y operarios'],['Destino'],['Cantidad',1],['Mano de obra',1],['Costo unit.',1],['Estado'],['']],[...LO].reverse().map(o=>{const f=DB.formulas.find(x=>x.id===o.formula);const p=prod(f.pt);const pd=DB.pedidos.find(x=>x.id===o.pedido);
      return`<tr class="${o.estado==='Anulada'?'anul':''}">${td('<span class="mono">'+o.id+'</span>')}${td(fDate(o.fechaFin||o.fecha))}${td('<span class="mono">'+p.id+'</span> '+esc(p.nombre))}${td(esc(o.maquina||f.maquina)+(o.horasMaq?` · ${fDec(o.horasMaq,1)} h`:'')+((o.operarios||[]).length?`<span class="sub">${o.operarios.map(x=>esc(emp(x.emp).nombre.split(' ')[0])+' '+fDec(x.horas,1)+' h').join(' · ')}</span>`:''))}${td(pd?`<span class="mono">${pd.numero}</span><span class="sub">${esc(cli(pd.cliente).nombre)}</span>`:'Para stock')}${td(fInt(o.cantidad)+' u'+(o.estado==='Finalizada'&&o.scrap?`<span class="sub">scrap ${fQty(o.scrap,'kg')}</span>`:''),1)}${td(o.mo?fG(o.mo):'',1)}${td(o.costoUnit?fG(o.costoUnit):'',1)}${td(o.estado==='Anulada'?chipDoc('op',o):(o.estado==='Finalizada'?'<span class="chip good">Finalizada</span>':'<span class="chip acc">Planificada</span>')+(invPend('op',o.id)?' <span class="chip warn">Invalidación pedida</span>':''))}${td(o.estado==='Anulada'?'':(o.estado==='Planificada'&&ed?`<button class="btn sm" data-act="finOP" data-id="${o.id}">Finalizar</button> `:'')+(ed&&!invPend('op',o.id)?`<button class="btn sm" data-act="invalidar" data-t="op" data-id="${o.id}">${o.estado==='Planificada'?'Anular':'Invalidar'}</button>`:''))}</tr>`}),'No hay órdenes que coincidan con el filtro.');
    h+=`<p class="note">Al finalizar una orden se cargan los operarios y sus horas. El sistema descuenta la materia prima del depósito Producción (incluida la merma) e ingresa lo fabricado a Productos terminados a su costo real: materiales más mano de obra (horas × costo por hora con aporte patronal). La mano de obra se descuenta del gasto en la cuenta Mano de obra aplicada a producción, con el centro de costo de la máquina. Si la fórmula lo indica, el scrap molido vuelve al depósito Producción.</p>`;
  }else if(t==='form'){
    h+=T([['Producto'],['Máquina y centro de costo'],['Componentes por unidad'],['Merma',1],['Scrap'],['Costo estimado de materiales',1]],DB.formulas.map(f=>{const p=prod(f.pt);const ce=sum(f.comp,c=>c.q*prod(c.p).costo)*(1+f.merma);
      return`<tr>${td(esc(p.nombre))}${td(f.maquina+`<span class="sub">${esc(ccName(f.cc))}</span>`)}${td(f.comp.map(c=>`${fDec(c.q,3)} kg ${esc(prod(c.p).nombre)}`).join('<br>'))}${td(fDec(f.merma*100,1)+' %',1)}${td(f.recupera?'<span class="chip rec">Se muele y reutiliza</span>':'<span class="chip">Pérdida</span>')}${td(fG(ce),1)}</tr>`}));
  }else{
    const mes=TODAY.slice(0,7);
    h+=T([['Máquina'],['Centro de costo'],['Órdenes finalizadas',1],['Horas de máquina este mes',1],['Unidades este mes',1],['Estado'],['']],DB.maquinas.map(m=>{const os=DB.ordenes.filter(o=>o.estado==='Finalizada'&&(o.maquina)===m.n),om=os.filter(o=>(o.fechaFin||'').startsWith(mes));
      return`<tr class="${m.activo===false?'anul':''}">${td(esc(m.n))}${td(esc(ccName(m.cc)))}${td(String(os.length),1)}${td(fDec(sum(om,o=>o.horasMaq||0),1)+' h',1)}${td(fInt(sum(om,o=>o.cantidad)),1)}${td(m.activo===false?'<span class="chip">Inactiva</span>':'<span class="chip good">Activa</span>')}${td(ed?`<button class="btn sm" data-act="toggleMaq" data-id="${m.id}">${m.activo===false?'Activar':'Desactivar'}</button>`:'')}</tr>`}));
    h+=ed?`<form class="bar" style="margin-top:12px;align-items:flex-end" data-form="maquina">${fInp('maq_n','Nombre de la máquina','text','','placeholder="Sopladora 3"')}${fSel('maq_cc','Centro de costo',ccOpts(),'SOP')}<button class="btn primary" type="submit">Agregar máquina</button></form>`:'';
    h+=`<p class="note">El centro de costo de la máquina recibe la mano de obra aplicada de las órdenes que se fabrican en ella.</p>`;
  }
  return h;
};

V.tesoreria=()=>{

  let h=`<div class="kpis">${DB.tes.map(x=>kpi(esc(x.n),fMon(saldoTes(x.id),x.m),(x.tipo==='Banco'?esc(x.banco)+' '+esc(x.nro)+' · ':'')+'cuenta '+x.c)).join('')}</div>
   <div class="bar"><span class="sp">${tabs('tesoreria',[['mov','Movimientos'],['val','Valores a depositar'+(DB.valores.some(v=>v.estado==='En cartera'&&v.fechaCheque<=TODAY)||efectivoREC()>0?' ('+(DB.valores.filter(v=>v.estado==='En cartera'&&v.fechaCheque<=TODAY).length+(efectivoREC()>0?1:0))+')':'')],['pre','Préstamos'],['cob','Recibos de cobro'],['pag','Pagos'],['gas','Gastos'],['cta','Cuentas']])}</span>${roChip('tesoreria')}
   ${ed?{val:'<button class="btn primary" data-act="nuevoDeposito">Registrar depósito</button>',pre:'<button class="btn primary" data-act="nuevoPrestamo">Nueva proforma de préstamo</button>',cta:'<button class="btn primary" data-act="nuevaCuentaTes">Nueva cuenta</button>'}[t]||'<button class="btn" data-act="nuevaTransf">Transferencia entre cuentas</button><button class="btn primary" data-act="nuevoGasto">Registrar gasto</button>':''}</div>`;

    h+=`<div class="kpis">${kpi('Efectivo a depositar',fG(efectivoREC()),'En Recaudaciones a depositar')}${kpi('Cheques para depositar',fG(sum(hoy,v=>v.monto)),hoy.length+' cheques al día o ya vencidos')}${kpi('Cheques diferidos',fG(sum(dif,v=>v.monto)),dif.length+' cheques con fecha futura')}${kpi('Depositado este mes',fG(sum(DB.depositos.filter(x=>!x.anulada&&x.fecha.startsWith(TODAY.slice(0,7))),x=>x.total)),DB.depositos.filter(x=>!x.anulada&&x.fecha.startsWith(TODAY.slice(0,7))).length+' depósitos')}</div>`;
    const L=filtrar('tes.val',DB.valores,v=>`${v.nro} ${v.banco} ${cli(v.cliente).nombre} ${cli(v.cliente).id} ${(DB.recibos.find(r=>r.id===v.recibo)||{}).numero} ${montoTxt(v.monto,'PYG')}`,v=>v.fechaCheque,v=>v.estado);
    h+=`<h3 style="font-size:17px">Cartera de cheques recibidos</h3>`+filtroBar('tes.val',DB.valores.length,L.length,['En cartera','Depositado','Anulado'])+T([['Fecha del cheque'],['Banco emisor'],['N° de cheque'],['Cliente'],['Recibo'],['Importe',1],['Situación']],[...L].sort((a,b)=>(a.estado==='En cartera')===(b.estado==='En cartera')?(a.fechaCheque<b.fechaCheque?-1:1):(a.estado==='En cartera'?-1:1)).map(v=>`<tr class="${v.estado==='Anulado'?'anul':''}">${td(fDate(v.fechaCheque))}${td(esc(v.banco))}${td('<span class="mono">'+esc(v.nro)+'</span>')}${td(esc(cli(v.cliente).nombre))}${td('<span class="mono">'+(DB.recibos.find(r=>r.id===v.recibo)||{}).numero+'</span>')}${td(fG(v.monto),1)}${td(v.estado==='En cartera'?(v.fechaCheque>TODAY?`<span class="chip warn">Diferido hasta ${fDate(v.fechaCheque)}</span>`:'<span class="chip acc">Para depositar</span>'):v.estado==='Depositado'?`<span class="chip good">Depositado ${fDate(v.fechaDep)}</span><span class="sub">${(DB.depositos.find(x=>x.id===v.deposito)||{}).numero||''}</span>`:'<span class="chip bad">Anulado</span>')}</tr>`),'No hay cheques que coincidan con el filtro.');
    h+=`<h3 style="font-size:17px">Depósitos bancarios</h3>`+T([['Depósito'],['Fecha'],['Banco'],['Boleta'],['Efectivo',1],['Cheques',1],['Total',1],['Registró'],['']],[...DB.depositos].reverse().map(x=>`<tr class="${x.anulada?'anul':''}">${td('<span class="mono">'+x.numero+'</span>')}${td(fDate(x.fecha))}${td(esc(tesAcc(x.cuenta).n))}${td(esc(x.boleta||'—'))}${td(x.efectivo?fG(x.efectivo):'—',1)}${td(x.cheques.length?fG(x.total-x.efectivo)+`<span class="sub">${x.cheques.length} cheques</span>`:'—',1)}${td(fG(x.total),1)}${td(esc(userName(x.usuario)))}${td(chipDoc('deposito',x)||(ed?`<button class="btn sm" data-act="invalidar" data-t="deposito" data-id="${x.id}">Invalidar</button>`:''))}</tr>`),'Todavía no hay depósitos.');
    h+=`<p class="note">El efectivo y los cheques cobrados quedan en Recaudaciones a depositar, y los diferidos en su cartera, hasta registrar el depósito. Recién ahí aumenta el saldo del banco. Un cheque diferido no se puede depositar antes de su fecha.</p>`;
  }else if(t==='pre'){
    const L=filtrar('tes.pre',DB.prestamos,x=>`${x.numero} ${x.entidad} ${x.concepto} ${montoTxt(x.capital,x.moneda)}`,x=>x.fechaDes,x=>x.estado);
    h+=filtroBar('tes.pre',DB.prestamos.length,L.length,['Proforma','Vigente','Cancelado','Descartada']);
    h+=T([['Préstamo'],['Entidad'],['Capital',1],['Tasa y plazo'],['Cuota',1],['Saldo de capital',1],['Próxima cuota'],['Estado'],['']],L.map(x=>{const nx=x.cuotas.find(q=>!q.pagada);const venc=x.estado==='Vigente'&&nx&&nx.fecha<TODAY;
      return`<tr class="${x.estado==='Descartada'?'anul':''}">${td('<span class="mono">'+x.numero+'</span>'+(x.concepto?`<span class="sub">${esc(x.concepto)}</span>`:''))}${td(esc(x.entidad)+`<span class="sub">${x.tipo==='Banco'?'Banco':'Tercero'}</span>`)}${td(fMon(x.capital,x.moneda),1)}${td(`${fDec(x.tasa,2)} % anual · ${x.plazo} meses<span class="sub">${{frances:'Sistema francés',aleman:'Sistema alemán',bullet:'Capital al vencimiento'}[x.sistema]}</span>`)}${td(fMon(x.cuotas[0].cuota,x.moneda),1)}${td(x.estado==='Proforma'?'—':fMon(saldoPrestamo(x),x.moneda),1)}${td(nx&&x.estado!=='Descartada'?`${fDate(nx.fecha)}${venc?'<span class="sub" style="color:var(--bad)">Vencida</span>':`<span class="sub">Cuota ${nx.n}/${x.plazo}</span>`}`:'—')}${td(x.estado==='Proforma'?`<span class="chip warn">Proforma</span><span class="sub">${x.enFlujo?'Incluida en el flujo':'Fuera del flujo'}</span>`:x.estado==='Vigente'?'<span class="chip acc">Vigente</span>':x.estado==='Cancelado'?'<span class="chip good">Cancelado</span>':'<span class="chip">Descartada</span>')}${td(`<button class="btn sm" data-act="verPrestamo" data-id="${x.id}">Ver cuadro</button>`+(ed&&x.estado==='Vigente'?` <button class="btn sm primary" data-act="pagarCuota" data-id="${x.id}">Pagar cuota</button>`:'')+(ed&&x.estado==='Proforma'?` <button class="btn sm primary" data-act="desembolsar" data-id="${x.id}">Registrar desembolso</button>`:''))}</tr>`}),'No hay préstamos que coincidan con el filtro.');
    h+=`<p class="note">Una proforma es una simulación: no mueve el banco ni la contabilidad, pero si está incluida en el flujo, su desembolso y sus cuotas aparecen en el flujo de caja proyectado. Al registrar el desembolso pasa a vigente: entra el dinero al banco y se registra la deuda. Cada cuota pagada separa capital e intereses.</p>`;
  }else if(t==='cta'){
    h+=T([['Cuenta'],['Tipo'],['Banco'],['N° de cuenta'],['Moneda'],['Cuenta contable'],['Saldo',1]],DB.tes.map(x=>`<tr>${td(esc(x.n))}${td(x.tipo||'Banco')}${td(esc(x.banco||'—'))}${td('<span class="mono">'+esc(x.nro||'—')+'</span>')}${td(x.m==='USD'?'Dólares':'Guaraníes')}${td('<span class="mono">'+x.c+'</span> '+esc(cta(x.c).n))}${td(fMon(saldoTes(x.id),x.m),1)}</tr>`));
    h+=`<p class="note">Al crear una cuenta se le asigna su cuenta contable dentro de Disponibilidades. Las cuentas aparecen para elegir en cobros, pagos, gastos, préstamos y transferencias.</p>`;
  }else if(t==='cob'){
    h+=reciboTable('tes.rec')+`<p class="note">Los recibos se emiten desde el módulo Cobranzas.</p>`;
  }else if(t==='pag'){
    h+=pagoTable('tes.pag')+`<p class="note">Los pagos se registran desde el módulo Pagos a proveedores.</p>`;
  }else{
    const L=filtrar('tes.gas',DB.gastos,g=>`${g.concepto} ${g.proveedor} ${g.ruc} ${g.comprobante} ${montoTxt(g.monto,g.moneda)}`,g=>g.fecha,g=>g.anulada?'Anulado':'Vigente');const ed=can('tesoreria',2);
    h+=filtroBar('tes.gas',DB.gastos.length,L.length,['Vigente','Anulado'])+T([['Fecha'],['Concepto'],['Proveedor'],['Comprobante'],['Cuenta'],['Centro de costo'],['Monto',1],['']],[...L].reverse().map(g=>`<tr class="${g.anulada?'anul':''}">${td(fDate(g.fecha))}${td(esc(g.concepto))}${td(esc(g.proveedor))}${td(esc(g.comprobante))}${td(esc(tesAcc(g.cuenta).n))}${td(esc(ccName(g.cc)))}${td(fMon(g.monto,g.moneda),1)}${td(chipDoc('gasto',g)||(ed?`<button class="btn sm" data-act="invalidar" data-t="gasto" data-id="${g.id}">Invalidar</button>`:''))}</tr>`),'No hay gastos que coincidan con el filtro.');
  }
  if(t==='pag')h+=`<p class="note" hidden>La diferencia de cambio se calcula sola: compara la cotización del día de la factura con la del día del cobro o pago, y se registra como ganancia o pérdida.</p>`;
  return h;
};

    const LA=filtrar('con.dia',DB.asientos,a=>`#${a.nro} ${a.nro} ${a.concepto} ${a.origen} ${a.ref} ${a.lines.map(l=>l.c+' '+(cta(l.c)||{}).n+' '+(l.cc||'')).join(' ')} ${fInt(sum(a.lines,l=>l.d))}`,a=>a.fecha,a=>a.origen);
    h+=filtroBar('con.dia',DB.asientos.length,LA.length,{l:'Origen',o:[...new Set(DB.asientos.map(a=>a.origen))]});
    const rows=[];[...LA].reverse().slice(0,300).forEach(a=>{
      rows.push(`<tr class="${a.anulado?'anul':''}"><td colspan="4"><b class="mono">#${a.nro}</b> · ${fDate(a.fecha)} · ${esc(a.concepto)} <span class="chip">${a.origen}</span>${a.anulado?` <span class="chip bad">Anulado por #${a.anulado}</span>`:''}${a.origen==='Manual'&&!a.anulado&&!a.anula&&can('contabilidad',2)&&!invPend('asiento',a.nro)?` <button class="btn sm" data-act="invalidar" data-t="asiento" data-id="${a.nro}">Invalidar</button>`:''}${invPend('asiento',a.nro)?' <span class="chip warn">Invalidación pedida</span>':''}</td></tr>`);
      a.lines.forEach(l=>rows.push(`<tr>${td('<span class="mono">'+l.c+'</span>')}${td((l.h?'&emsp;':'')+esc((cta(l.c)||{}).n)+(l.cc?` <span class="chip">${l.cc}</span>`:''))}${td(l.d?fInt(l.d):'',1)}${td(l.h?fInt(l.h):'',1)}</tr>`));});
    h+=T([['Cuenta'],['Descripción'],['Debe ₲',1],['Haber ₲',1]],rows,'No hay asientos que coincidan con el filtro.')+(LA.length>300?'<p class="note">Se muestran los 300 asientos más recientes del filtro. Acotá las fechas para ver otros.</p>':'');
  }else if(t==='mayor'){
    const c=S.mayor;let run=0;const ct=cta(c);const deu=['A','E'].includes(ct.t);
    const rows=[];DB.asientos.forEach(a=>a.lines.filter(l=>l.c===c).forEach(l=>{run+=deu?l.d-l.h:l.h-l.d;rows.push(`<tr>${td(fDate(a.fecha))}${td('<span class="mono">#'+a.nro+'</span>')}${td(esc(a.concepto))}${td(l.d?fInt(l.d):'',1)}${td(l.h?fInt(l.h):'',1)}${td(fInt(run),1)}</tr>`)}));
    h+=`<div class="bar">${fSel('mx','Cuenta',DB.plan.map(x=>[x.c,x.c+' · '+x.n]),c,'data-chg="mayor"')}</div>`+T([['Fecha'],['Asiento'],['Concepto'],['Debe',1],['Haber',1],['Saldo',1]],rows);
  }else if(t==='sys'){
    const s=saldos();let td_=0,th_=0,sd=0,sa=0;
    const rows=DB.plan.map(c=>{const x=s[c.c];if(!x.d&&!x.h)return'';td_+=x.d;th_+=x.h;const n=x.d-x.h;n>0?sd+=n:sa-=n;
      return`<tr>${td('<span class="mono">'+c.c+'</span>')}${td(esc(c.n))}${td(fInt(x.d),1)}${td(fInt(x.h),1)}${td(n>0?fInt(n):'',1)}${td(n<0?fInt(-n):'',1)}</tr>`}).filter(Boolean);
    h+=T([['Cuenta'],['Descripción'],['Debe',1],['Haber',1],['Saldo deudor',1],['Saldo acreedor',1]],rows,'',`<tr><td colspan="2">Totales ${td_===th_?'<span class="chip good">Balanceado</span>':'<span class="chip bad">Descuadrado</span>'}</td><td class="num">${fInt(td_)}</td><td class="num">${fInt(th_)}</td><td class="num">${fInt(sd)}</td><td class="num">${fInt(sa)}</td></tr>`);
  }else if(t==='res'){
    const s=saldos();const ing=DB.plan.filter(c=>c.t==='I'),egr=DB.plan.filter(c=>c.t==='E');
    const ti=sum(ing,c=>s[c.c].h-s[c.c].d),te=sum(egr,c=>s[c.c].d-s[c.c].h);
    const rows=[`<tr><td colspan="2"><b>Ingresos</b></td></tr>`,...ing.map(c=>`<tr>${td('&emsp;'+esc(c.n))}${td(fInt(s[c.c].h-s[c.c].d),1)}</tr>`),`<tr>${td('<b>Total ingresos</b>')}${td('<b>'+fInt(ti)+'</b>',1)}</tr>`,
      `<tr><td colspan="2"><b>Costos y gastos</b></td></tr>`,...egr.map(c=>`<tr>${td('&emsp;'+esc(c.n))}${td(fInt(s[c.c].d-s[c.c].h),1)}</tr>`),`<tr>${td('<b>Total costos y gastos</b>')}${td('<b>'+fInt(te)+'</b>',1)}</tr>`];
    h+=T([['Concepto'],['Importe ₲',1]],rows,'',`<tr><td>Resultado del período ${ti-te>=0?'<span class="chip good">Ganancia</span>':'<span class="chip bad">Pérdida</span>'}</td><td class="num">${fInt(ti-te)}</td></tr>`);
  }else if(t==='cc'){
    const ccs=DB.ccs;const m={};DB.asientos.forEach(a=>a.lines.forEach(l=>{if(!l.cc)return;m[l.c]=m[l.c]||{};const x=cta(l.c);const v=x.t==='I'?l.h-l.d:l.d-l.h;m[l.c][l.cc]=(m[l.c][l.cc]||0)+v}));
    const used=ccs.filter(c=>Object.values(m).some(r=>r[c.id]));const res={};used.forEach(c=>res[c.id]=0);
    const sec=(t2,lab)=>{const rs=DB.plan.filter(c=>c.t===t2&&m[c.c]);return[`<tr><td colspan="${used.length+2}"><b>${lab}</b></td></tr>`,...rs.map(c=>{used.forEach(k=>res[k.id]+=(t2==='I'?1:-1)*(m[c.c][k.id]||0));const tt=sum(used,k=>m[c.c][k.id]||0);return`<tr>${td('&emsp;'+esc(c.n))}${used.map(k=>td(m[c.c][k.id]?fInt(m[c.c][k.id]):'—',1)).join('')}${td(fInt(tt),1)}</tr>`})]};
    const rows=[...sec('I','Ingresos'),...sec('E','Costos y gastos')];const tot=sum(used,k=>res[k.id]);
    h+=T([['Cuenta (₲)'],...used.map(c=>[`${c.id}<span class="sub" style="text-transform:none;letter-spacing:0">${esc(c.n)}</span>`,1]),['Total',1]],rows,'Todavía no hay movimientos con centro de costo.',`<tr><td>Resultado</td>${used.map(k=>`<td class="num" style="${res[k.id]<0?'color:var(--bad)':''}">${fInt(res[k.id])}</td>`).join('')}<td class="num">${fInt(tot)}</td></tr>`);
    h+=`<p class="note">Cada documento lleva su centro de costo: ventas (Comercial por defecto), compras de servicios, gastos, órdenes de producción (según la fórmula) y asientos manuales. Las diferencias de cambio van a Administración. Los centros se configuran en Configuración.</p>`;
  }else if(t==='ivav'||t==='ivac'){
    const docs=t==='ivav'?DB.ventas.filter(v=>!v.inicial).map(v=>v.anulada?{fecha:v.fecha,num:v.numero+' · ANULADA',ruc:cli(v.cliente).ruc,nom:cli(v.cliente).nombre,cz:1,g10:0,i10:0,g5:0,i5:0,ex:0,tot:0}:({fecha:v.fecha,num:v.numero,ruc:cli(v.cliente).ruc,nom:cli(v.cliente).nombre,cz:v.cotiz,g10:v.g10,i10:v.iva10,g5:v.g5,i5:v.iva5,ex:v.ex,tot:v.total}))
      :[...DB.compras.filter(c=>!c.anulada).map(c=>({fecha:c.fecha,num:c.numero,ruc:prv(c.proveedor).ruc,nom:prv(c.proveedor).nombre,cz:c.cotiz,g10:c.g10,i10:c.iva10,g5:c.g5,i5:c.iva5,ex:c.ex,tot:c.total})),
        ...DB.gastos.filter(g=>!g.anulada).map(g=>{const i=ivaOf(g.monto,g.iva);return{fecha:g.fecha,num:g.comprobante,ruc:g.ruc,nom:g.proveedor,cz:g.cotiz,g10:g.iva===10?g.monto-i:0,i10:g.iva===10?i:0,g5:g.iva===5?g.monto-i:0,i5:g.iva===5?i:0,ex:g.iva===0?g.monto:0,tot:g.monto}})];
    docs.sort((a,b)=>a.fecha<b.fecha?-1:1);const k=['g10','i10','g5','i5','ex','tot'];const tt={};k.forEach(x=>tt[x]=sum(docs,d=>d[x]*d.cz));
    h+=T([['Fecha'],['Comprobante'],['RUC'],['Razón social'],['Gravado 10%',1],['IVA 10%',1],['Gravado 5%',1],['IVA 5%',1],['Exento',1],['Total',1]],docs.map(d=>`<tr>${td(fDate(d.fecha))}${td('<span class="mono">'+esc(d.num)+'</span>')}${td(esc(d.ruc))}${td(esc(d.nom))}${k.map(x=>td(fInt(d[x]*d.cz),1)).join('')}</tr>`),'',`<tr><td colspan="4">Totales en guaraníes</td>${k.map(x=>`<td class="num">${fInt(tt[x])}</td>`).join('')}</tr>`);
    h+=`<p class="note">Importes en guaraníes; los comprobantes en dólares se convierten a la cotización de su fecha. Este libro es la base para la liquidación mensual de IVA ante la DNIT.</p>`;
  }else{
    const N={A:'Activo',P:'Pasivo',PN:'Patrimonio neto',I:'Ingreso',E:'Egreso'};
    h+=T([['Código'],['Cuenta'],['Tipo']],DB.plan.map(c=>`<tr>${td('<span class="mono">'+c.c+'</span>')}${td(esc(c.n))}${td(N[c.t])}</tr>`));
    h+=`<p class="note">Plan de cuentas simplificado para la demostración. En la versión final se carga el plan de cuentas completo de la empresa.</p>`;
  }
  return h;
};

     <div class="bar"><span class="sp tots"><span class="big">Total <b>${fMon(sum(x.items,i=>i.cantidad*i.precio),x.moneda)}</b></span></span>

/* ---- Buscador de clientes y proveedores (código, RUC o nombre) ---- */
const pickOpts=list=>list.map(c=>[c.id,`${c.id} · ${c.nombre} · RUC ${c.ruc}`]);
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function enhancePickers(root){
  root.querySelectorAll('select[data-pick]').forEach(sel=>{
    const wrap=document.createElement('div');wrap.className='pick';
    const inp=document.createElement('input');inp.type='text';inp.id=sel.id+'_q';inp.autocomplete='off';inp.spellcheck=false;
    inp.placeholder='Código, RUC o nombre';inp.setAttribute('role','combobox');inp.setAttribute('aria-expanded','false');inp.setAttribute('aria-autocomplete','list');
    const list=document.createElement('div');list.className='pick-list';list.id=sel.id+'_lb';list.setAttribute('role','listbox');list.hidden=true;inp.setAttribute('aria-controls',list.id);
    sel.parentNode.insertBefore(wrap,sel);wrap.append(inp,sel);document.body.appendChild(list);sel.hidden=true;sel.tabIndex=-1;
    const lab=root.querySelector(`label[for="${sel.id}"]`);if(lab)lab.htmlFor=inp.id;
    const help=document.createElement('span');help.className='pick-help';wrap.appendChild(help);
    const opts=()=>[...sel.options].map(o=>{const[id,nom,ruc]=o.textContent.split(' · ');return{v:o.value,id,nom,ruc:(ruc||'').replace('RUC ',''),t:o.textContent}});
    const cur=()=>opts().find(o=>o.v===sel.value);
    const show=()=>{const o=cur();inp.value=o?`${o.id} · ${o.nom}`:'';help.textContent=o?'RUC '+o.ruc:''};show();
    let items=[],act=0,typed=false;
    const filter=q=>{const n=norm(q).trim();if(!n)return opts();const d=q.replace(/\D/g,'');const ws=n.split(/\s+/);
      const r=opts().filter(o=>{const t=norm(o.t);return ws.every(w=>t.includes(w))||(d.length>=3&&/^[\d\s.-]+$/.test(q)&&o.ruc.replace(/\D/g,'').includes(d))});
      const ex=o=>norm(o.id)===n||o.ruc.replace(/\D/g,'')===d&&d.length>=3||norm(o.ruc)===n;return r.sort((a,b)=>ex(b)-ex(a))};
    const place=()=>{const r=inp.getBoundingClientRect();Object.assign(list.style,{left:r.left+'px',top:(r.bottom+4)+'px',width:Math.max(r.width,280)+'px'});
      const lim=window.innerHeight-r.bottom-16;list.style.maxHeight=Math.max(Math.min(lim,280),140)+'px'};
    const draw=q=>{items=filter(q).slice(0,60);act=0;
      list.innerHTML=items.length?items.map((o,i)=>`<div role="option" id="${list.id}_${i}" class="${i===act?'on':''}" data-i="${i}" aria-selected="${i===act}"><b class="mono">${esc(o.id)}</b><span>${esc(o.nom)}</span><span class="mono r">${esc(o.ruc)}</span></div>`).join(''):`<p class="pick-empty">No hay coincidencias para “${esc(q)}”. Probá con el código (por ejemplo ${esc((opts()[0]||{}).id||'C001')}), el RUC o parte del nombre.</p>`;
      place();list.hidden=false;inp.setAttribute('aria-expanded','true');mark()};
    const mark=()=>{[...list.children].forEach((e,i)=>{e.classList.toggle('on',i===act);e.setAttribute('aria-selected',i===act)});const e=list.children[act];if(e&&e.scrollIntoView)e.scrollIntoView({block:'nearest'});if(items[act])inp.setAttribute('aria-activedescendant',list.id+'_'+act)};
    const close=()=>{list.hidden=true;inp.setAttribute('aria-expanded','false');inp.removeAttribute('aria-activedescendant')};
    const pick=o=>{const ch=sel.value!==o.v;sel.value=o.v;typed=false;show();close();if(ch)sel.dispatchEvent(new Event('change',{bubbles:true}))};
    inp.addEventListener('focus',()=>inp.select());
    inp.addEventListener('click',()=>{if(list.hidden)draw('')});
    inp.addEventListener('input',e=>{e.stopPropagation();typed=true;draw(inp.value)});
    inp.addEventListener('change',e=>e.stopPropagation());
    inp.addEventListener('keydown',e=>{
      if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(list.hidden)draw(typed?inp.value:'');else if(items.length){act=(act+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;mark()}}
      else if(e.key==='Enter'){e.preventDefault();if(!list.hidden&&items[act])pick(items[act])}
      else if(e.key==='Escape'){if(!list.hidden){e.preventDefault();e.stopPropagation();close();show()}}
      else if(e.key==='Tab'){if(!list.hidden&&typed&&items[act])pick(items[act]);else close()}});
    inp.addEventListener('blur',()=>setTimeout(()=>{if(document.activeElement!==inp){if(typed&&items.length===1)pick(items[0]);close();show();typed=false}},120));
    list.addEventListener('mousedown',e=>{e.preventDefault();const d=e.target.closest('[data-i]');if(d)pick(items[+d.dataset.i])});
    const mb=root.querySelector('.mbody');if(mb)mb.addEventListener('scroll',()=>{if(!list.hidden)place()});
  });
}

    const p=prod(l.p);const SRC=LC.oc||LC.ped;const L=SRC&&l.ol!=null?SRC.items[l.ol]:null;
    const sub=[LC.venta?`Stock en ${almName(almDef(p))}: ${fQty(stA(p,almDef(p)),p.u)}`:p.tipo==='SV'?'Servicio · '+cta(invCta(p)).n:'Stock: '+fQty(p.stock,p.u),'IVA '+p.iva+'%',L?`${SRC.numero}: pendiente ${fQty(r2(L.q-L.fact),p.u)} a ${fMon(L.pr,mon)}`:''].filter(Boolean).join(' · ');
    return`<tr><td><input class="cod mono" data-li="${i}" data-f="cod" value="${esc(l.p)}" ${L?'disabled':''} aria-label="Código del ${art}" style="width:90px" autocomplete="off"></td><td><select data-li="${i}" data-f="p" ${L?'disabled':''} aria-label="${art}">${opt(DB.productos.filter(LC.filter).map(x=>[x.id,x.nombre]),l.p)}</select><span class="sub">${sub}</span></td><td><input class="q num" type="number" step="any" min="0" data-li="${i}" data-f="q" value="${l.q}" aria-label="Cantidad"></td><td><input class="p num" type="number" step="any" min="0" data-li="${i}" data-f="pr" value="${l.pr}" aria-label="Precio con IVA"></td><td class="num" id="sn${i}"></td><td class="num" id="st${i}"></td><td><button type="button" class="btn sm" data-act="rmLine" data-i="${i}" aria-label="Quitar línea">Quitar</button></td></tr>`}).join('')}</tbody></table></div>
  <div class="bar"><button type="button" class="btn sm" data-act="addLine">Agregar ${art}</button>${LC.venta?'':'<button type="button" class="btn sm" data-act="addLineCta">Agregar por cuenta contable</button>'}<span class="sp"></span><div class="tots" id="tots"></div></div>`;
  drawTots();
}
function drawTots(){
  const mon=fv('moneda');ML.forEach((l,i)=>{const e=$('#st'+i);if(e)e.textContent=fMon(l.q*l.pr,mon);const n=$('#sn'+i);if(n){const r=lineaIva(l);n.textContent=fMon(l.pr-ivaOf(+l.pr,r),mon)}});
  const t=docTotals(ML.filter(l=>l.q>0));const cz=mon==='USD'?cot(fv('fecha')||TODAY):1;
  $('#tots').innerHTML=`<span>IVA 10% <b>${fMon(t.iva10,mon)}</b></span><span>IVA 5% <b>${fMon(t.iva5,mon)}</b></span><span class="big">Total <b>${fMon(t.total,mon)}</b></span>${mon==='USD'?`<span>Equivale a <b>${fG(t.total*cz)}</b> (₲ ${fInt(cz)})</span>`:''}`;
  if($('#aprnote')&&MCFG&&MCFG.input)MCFG.input({target:{}});
  const lw=$('#limw');if(lw&&LC&&LC.venta){const c=cli(fv('cliente'));let h='';const sb=$('#mform button[type=submit]');
    const o={condicion:fv('condicion'),cliente:c.id,moneda:mon,fecha:fv('fecha')||TODAY,items:ML.filter(l=>l.q>0).map(l=>({p:l.p,q:+l.q,pr:+l.pr}))};
    const mot=o.items.length?creditCheck(o):null;const k=cartera(c);
    if(o.condicion==='credito'&&k.vencido>0)h+=`<span class="chip bad">Tiene ${fG(k.vencido)} vencido</span> `;
    if(mot){h+=`<span class="chip warn">${esc(mot)}</span>`;

    else if(o.condicion==='credito'&&c.limite>0){const cz2=cot(o.fecha);const t2=docTotals(o.items);const nv=c.m===mon?t2.total:mon==='USD'?t2.total*cz2:t2.total/cz2;h+=`Crédito disponible después de esta factura: ${fMon(c.limite-k.usado-nv,c.m)}`}
    lw.innerHTML=h;if(sb)sb.textContent=mot&&!can('autcred')?'Enviar a autorización':'Emitir factura';
    LC.motivo=mot}
}

    if(!/^\d{3,8}-\d$/.test(r))throw new Error('El RUC debe tener el formato 80000000-0.');
    if(DB.clientes.some(x=>x.ruc===r&&x.id!==c.id))throw new Error('Ya existe un cliente con ese RUC.');
    let plazo=c.plazo||0,limite=c.limite||0;
    if(aut){if($('#habil').checked){plazo=Math.round(+fv('plazo')||0);limite=+fv('limite')||0;if(!(plazo>0))throw new Error('Indicá el plazo de pago en días.');if(!(limite>0))throw new Error('Indicá el monto del límite de crédito.')}else{plazo=0;limite=0}}

function parseFE(txt){
  if(txt.trim().startsWith('{')){const j=JSON.parse(txt);return j}
  const x=new DOMParser().parseFromString(txt,'application/xml');
  if(x.getElementsByTagName('parsererror').length)throw new Error('El archivo no es un XML válido.');
  const g=(n,root=x)=>{const e=root.getElementsByTagNameNS('*',n)[0]||root.getElementsByTagName(n)[0];return e?e.textContent.trim():''};
  const de=x.getElementsByTagNameNS('*','DE')[0];if(!de)throw new Error('No se encontró un documento electrónico del SIFEN en el archivo.');
  const items=[...x.getElementsByTagNameNS('*','gCamItem')].map(it=>({codigo:g('dCodInt',it),descripcion:g('dDesProSer',it),cantidad:+g('dCantProSer',it),precio:+g('dPUniProSer',it),iva:g('dTasaIVA',it)===''?10:+g('dTasaIVA',it)}));
  if(!items.length)throw new Error('El documento no tiene ítems.');
  return{cdc:de.getAttribute('Id')||'',emisor:{ruc:g('dRucEm')+(g('dDVEmi')?'-'+g('dDVEmi'):''),nombre:g('dNomEmi')},fecha:g('dFeEmiDE').slice(0,10),numero:[g('dEst'),g('dPunExp'),g('dNumDoc')].join('-'),timbrado:g('dNumTim'),moneda:g('cMoneOpe')==='USD'?'USD':'PYG',condicion:g('iCondOpe')==='2'?'credito':'contado',items};
}
function loadFE(txt){
  try{const d=parseFE(txt);d.items.forEach(it=>{const k=d.emisor.ruc+'|'+it.codigo;it.p=DB.mapeos[k]||(/master/i.test(it.descripcion)?'MP03':/pp\b|polipropileno/i.test(it.descripcion)?'MP02':/recicl/i.test(it.descripcion)?'RC01':'MP01')});S.fe=d;render()}
  catch(e){toast(e.message)}
}

    if(f==='maquina'){if(!can('produccion',2))return;const n=fv('maq_n').trim();if(!n){toast('Escribí el nombre de la máquina.');return}if(DB.maquinas.some(m=>m.n.toLowerCase()===n.toLowerCase())){toast('Ya existe una máquina con ese nombre.');return}DB.maquinas.push({id:'M'+Date.now().toString(36),n,cc:fv('maq_cc'),activo:true});log(`Agregó la máquina ${n}`);render();toast('Máquina agregada')}
    if(f==='familia'){const id=fv('fa_id').trim().toUpperCase(),n=fv('fa_n').trim();if(!/^[A-Z0-9]{2,6}$/.test(id)||!n){toast('El código lleva de 2 a 6 letras o números, y el nombre es obligatorio.');return}if(DB.familias.some(x=>x.id===id)){toast('Ya existe una familia con ese código.');return}DB.familias.push({id,n});log(`Creó la familia de artículos ${id} ${n}`);render();toast('Familia agregada')}
    if(f==='plazos'){const v=[...new Set(fv('plz').split(/[,;\s]+/).map(x=>Math.round(+x)).filter(x=>x>0&&x<=365))].sort((a,b)=>a-b);if(!v.length){toast('Ingresá al menos un plazo en días.');return}DB.config.plazos=v;log('Actualizó los plazos de crédito: '+v.join(', ')+' días');render();toast('Plazos guardados')}
    if(f==='cc'){const id=fv('cc_id').trim().toUpperCase(),n=fv('cc_n').trim();if(!/^[A-Z0-9]{2,6}$/.test(id)||!n){toast('El código lleva de 2 a 6 letras o números, y el nombre es obligatorio.');return}if(DB.ccs.some(c=>c.id===id)){toast('Ya existe un centro de costo con ese código.');return}DB.ccs.push({id,n,activo:true});log(`Creó el centro de costo ${id} ${n}`);render();toast('Centro de costo agregado')}
    if(f==='umbral'){const v=+fv('umb');if(!(v>=0)){toast('Indicá un monto válido.');return}DB.config.ocUmbral=v;log(`Cambió el monto de aprobación de compras a ${fG(v)}`);render();toast('Monto de aprobación guardado')}
    if(f==='cotiz'){const v=+fv('c_v'),d=fv('c_f');if(!(v>0)||!d){toast('Cargá la fecha y la cotización.');return}DB.cotiz=DB.cotiz.filter(c=>c.fecha!==d);DB.cotiz.push({fecha:d,v});log(`Cargó la cotización ${fInt(v)} ₲/US$ del ${fDate(d)}`);render();toast('Cotización guardada')}});
  if(enLinea)odStart();else render();
}
if(typeof document!=='undefined')boot();
</script>
